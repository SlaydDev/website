<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact | CaptainEXE</title>
  
  <meta name="description" content="Get in touch with CaptainEXE.">
  <link rel="icon" type="image/png" href="https://cdn-captainexe.pages.dev/logo.png">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
  <div class="cursor" id="cursor"></div>

  <nav>
    <div class="logo">CaptainEXE</div>
    <ul>
      <li><a href="/">home</a></li>
      <li><a href="/#about">about</a></li>
      <li><a href="/projects">projects</a></li>
      <li><a href="/#blog">blog</a></li>
      <li><a href="/#stats">stats</a></li>
      <li><a href="/contact" class="active">contact</a></li>
    </ul>
  </nav>

  <main class="contact-page-main">
    <div class="contact-container">
      <div class="discord-card">
        <div class="discord-banner" id="discordBanner" style="background-image: url('/assets/banner.gif'); background-size: cover; background-position: center;"></div>
        <div class="discord-avatar-container">
          <img src="/assets/logo.png" alt="Avatar" class="discord-avatar" id="discordAvatar" onerror="this.src='https://cdn-captainexe.pages.dev/logo.png'">
        </div>
        
        <div class="discord-user-info">
          <div class="discord-name-row">
            <span class="discord-display-name">Captain</span>
            <span class="discord-verified-badge" title="Verified"><i class="fa-solid fa-circle-check"></i></span>
          </div>
          
          <div class="discord-handle-row">
            <span class="discord-username">thecaptainexe</span>
            <span class="discord-dot">•</span>
            <span class="discord-pronouns">He/Him</span>
          </div>
        </div>
      </div>

      <div class="social-links-section">
        <h2>Let's Connect</h2>
        <p class="section-subtitle">Reach out through any of these platforms.</p>
        
        <div class="social-links-grid">
          <a href="https://github.com/thecaptainexe" target="_blank" class="social-link-item">
            <svg class="transparent-svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
            <span>GitHub</span>
          </a>

          <a href="https://g.dev/thecaptainexe" target="_blank" class="social-link-item">
            <svg class="transparent-svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v8"></path><path d="M8 12h8"></path></svg>
            <span>Google Developer</span>
          </a>

          <a href="https://youtube.com/@itscaptainexe" target="_blank" class="social-link-item">
            <svg class="transparent-svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 0 0-1.95 1.96A29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.95 1.96C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"></path><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="currentColor"></polygon></svg>
            <span>YouTube</span>
          </a>

          <a href="mailto:hello@captainexe.anonaddy.me" class="social-link-item">
            <svg class="transparent-svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <span>Email</span>
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; CaptainEXE 2026</p>
  </footer>

  <button id="scrollTopBtn">↑</button>

  <style>
    .contact-page-main {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      margin-top: 40px;
    }
    .contact-container {
      display: flex;
      flex-wrap: wrap;
      gap: 60px;
      max-width: 900px;
      width: 100%;
      justify-content: center;
      align-items: center;
    }

    /* Discord Card Styling (Upscaled & Formfitted) */
    .discord-card {
      width: 100%;
      max-width: 360px;
      background: #0b0b0c;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #222;
      position: relative;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }

    .discord-banner {
      width: 100%;
      height: 120px;
      background: linear-gradient(135deg, #7c3aed, #4c1d95);
    }

    .discord-avatar-container {
      position: relative;
      margin-top: -50px;
      margin-left: 20px;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: #0b0b0c;
      padding: 4px;
    }

    .discord-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .discord-user-info {
      padding: 14px 20px 24px 20px;
    }

    .discord-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .discord-display-name {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
    }

    .discord-verified-badge {
      color: #5865F2;
      font-size: 1rem;
    }

    .discord-handle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      font-size: 0.95rem;
      color: #949ba4;
    }

    .discord-username {
      font-weight: 500;
    }

    .discord-dot {
      font-size: 0.75rem;
    }

    .discord-pronouns {
      color: #b5bac1;
    }

    /* Social Links Section */
    .social-links-section {
      flex: 1;
      min-width: 280px;
      max-width: 380px;
    }
    .social-links-section h2 {
      margin-bottom: 5px;
      font-size: 28px;
    }
    .social-links-section .section-subtitle {
      color: #888;
      margin-bottom: 24px;
      font-size: 14px;
    }
    .social-links-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .social-link-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 18px;
      border-radius: 8px;
      color: #fff;
      text-decoration: none;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .social-link-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }
    .transparent-svg {
      stroke: currentColor;
      fill: none;
      width: 22px;
      height: 22px;
    }
  </style>

  <script src="../script.js"></script>
</body>
</html>
